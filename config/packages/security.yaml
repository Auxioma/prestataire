security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Account\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Account\Security\UserChecker
            entry_point: form_login

            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_token_id: logout
                csrf_parameter: _csrf_token

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                csrf_token_id: 'authenticate'
                success_handler: App\Account\Security\LoginSuccessHandler

            login_throttling:
                max_attempts: 5

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                secure: auto
                httponly: true
                samesite: lax
                always_remember_me: false

                token_provider:
                    doctrine: true

            custom_authenticators:
                - App\Account\Security\GoogleAuthenticator

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/notifications, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/signalements, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/favoris, roles: ROLE_CLIENT }
        - { path: ^/client/parametres, roles: ROLE_CLIENT }
        - { path: ^/demandes-de-devis, roles: ROLE_CLIENT }
        - { path: ^/prestataire/abonnements, roles: ROLE_PRESTATAIRE }
        - { path: ^/prestataire/calendrier, roles: ROLE_PRESTATAIRE }
        - { path: ^/prestataire/espace-pro, roles: ROLE_PRESTATAIRE }
        - { path: ^/prestataire/parametres, roles: ROLE_PRESTATAIRE }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
