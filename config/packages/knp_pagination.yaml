knp_paginator:
    page_range: 5                      # Nombre de pages affichées dans les liens de navigation
    default_options:
        page_name: page                # Nom du paramètre dans l'URL (?page=2)
        sort_field_name: sort          # Nom du paramètre de tri
        sort_direction_name: direction
        distinct: true                 # Garantit des résultats uniques
    template:
        # Template Bootstrap 5 natif du bundle
        pagination: '@KnpPaginator/Pagination/bootstrap_v5_pagination.html.twig'
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'